<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de Chantier</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b-2 border-green-500 pb-4 mb-6 gap-4">
            <h1 class="text-3xl font-bold text-green-700">Fiche de Chantier</h1>
            <div>
                <input type="file" id="importFichier" accept=".json" class="hidden" onchange="importerDonnees(event)">
                <button type="button" onclick="document.getElementById('importFichier').click()" class="px-4 py-2 bg-blue-100 text-blue-800 font-bold rounded shadow hover:bg-blue-200 border border-blue-300 transition">
                    📂 Ouvrir une fiche existante
                </button>
            </div>
        </div>

        <form id="chantierForm" class="space-y-8">

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">1. Informations Client</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Nom & Prénom</label>
                        <input type="text" name="client_nom" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Téléphone</label>
                        <input type="tel" name="client_tel" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Courriel</label>
                        <input type="email" name="client_email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Date de visite</label>
                        <input type="date" name="date_visite" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Date de chantier souhaitée</label>
                        <input type="date" name="date_chantier" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Adresse postale</label>
                        <input type="text" name="client_adresse" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium">Stationnement</label>
                        <select name="stationnement" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Facile/Devant">Facile / Devant</option>
                            <option value="Difficile/rue Etroite">Difficile / Rue Étroite</option>
                            <option value="éloigné >20m">Éloigné > 20m</option>
                            <option value="Parking/Garage">Parking / Garage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Passage</label>
                        <select name="passage" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Libre">Libre</option>
                            <option value="Standard/Portail">Standard / Portail</option>
                            <option value="Etroit/Porte">Étroit / Porte</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Réseaux (Cochez si présents)</label>
                        <div class="mt-2 space-x-4">
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux" value="Câbles/Tuyauterie" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Câbles / Tuyauterie</span></label>
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux" value="Regard" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Regard / Sortie visible</span></label>
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux" value="Arrosage" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Arrosage</span></label>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">2. Doléances & Contrat</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Type de Contrat</label>
                        <select name="contrat" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Ponctuel">Ponctuel</option>
                            <option value="Quinzomadaire/Trihebdomadaire">Quinzomadaire / Trihebdomadaire</option>
                            <option value="Mensuel">Mensuel</option>
                            <option value="Bimestriel">Bimestriel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Préférence planning</label>
                        <input type="text" name="pref_planning" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Notes & Doléances</label>
                        <textarea name="notes_doleances" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"></textarea>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">3. Plan du Chantier</h2>
                <p class="text-sm text-gray-600 mb-2">Utilisez les outils à gauche pour dessiner. <strong>L'outil Ligne 〰️ sert de règle</strong> (les mesures s'afficheront en dessinant).</p>
                
                <div class="flex flex-col sm:flex-row gap-3 mb-3 justify-between items-start sm:items-center">
                    <div class="flex gap-3 bg-gray-50 p-2 rounded border inline-flex">
                        <span class="text-sm font-medium text-gray-700 my-auto mr-2">Couleur :</span>
                        <button type="button" onclick="changerCouleur('#22c55e', this)" class="color-btn w-8 h-8 rounded-full bg-green-500 border-4 border-gray-800 shadow"></button>
                        <button type="button" onclick="changerCouleur('#8b4513', this)" class="color-btn w-8 h-8 rounded-full bg-[saddlebrown] border-4 border-transparent hover:border-gray-400 shadow"></button>
                        <button type="button" onclick="changerCouleur('#3b82f6', this)" class="color-btn w-8 h-8 rounded-full bg-blue-500 border-4 border-transparent hover:border-gray-400 shadow"></button>
                        <button type="button" onclick="changerCouleur('#ef4444', this)" class="color-btn w-8 h-8 rounded-full bg-red-500 border-4 border-transparent hover:border-gray-400 shadow"></button>
                        <button type="button" onclick="changerCouleur('#000000', this)" class="color-btn w-8 h-8 rounded-full bg-black border-4 border-transparent hover:border-gray-400 shadow"></button>
                        <button type="button" onclick="changerCouleur('#6b7280', this)" class="color-btn w-8 h-8 rounded-full bg-gray-500 border-4 border-transparent hover:border-gray-400 shadow"></button>
                    </div>

                    <button type="button" onclick="centrerSurMoi()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white font-bold rounded shadow hover:bg-blue-700 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                        </svg>
                        Me localiser
                    </button>
                </div>

                <div id="map" class="w-full h-[500px] rounded-lg border-2 border-gray-300 z-0 relative"></div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">4. Information Station (Terrain)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Topographie</label>
                        <select name="topographie" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Plat">Plat</option>
                            <option value="Pente douce">Pente douce</option>
                            <option value="Talus raide">Talus raide</option>
                            <option value="Diversifié">Diversifié</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Texture du sol</label>
                        <select name="texture_sol" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Argileux">Argileux</option>
                            <option value="Sableux">Sableux</option>
                            <option value="Limoneux">Limoneux</option>
                            <option value="Caillouteux">Caillouteux</option>
                            <option value="Mélangé/Importé">Mélangé / Importé</option>
                        </select>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">5. Travaux à réaliser</h2>
                
                <div class="flex flex-col md:flex-row gap-4 mb-6 bg-green-50 p-4 rounded border border-green-200">
                    <div class="flex-grow">
                        <label class="block text-sm font-bold text-green-800 mb-1">Ajouter une catégorie de travaux :</label>
                        <select id="selectCategorieTravaux" class="block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="Taille">Taille</option>
                            <option value="Tonte">Tonte / Débroussaillage</option>
                            <option value="Nettoyage">Nettoyage</option>
                            <option value="Creation">Création</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="button" onclick="ajouterBlocTravail()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 font-bold shadow transition">
                            + Ajouter ces travaux
                        </button>
                    </div>
                </div>

                <div id="conteneurTravaux" class="space-y-4"></div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">6. Divers & Validation</h2>
                <div class="mb-4">
                    <label class="block text-sm font-medium">Observations Diverses</label>
                    <textarea name="observations_diverses" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"></textarea>
                </div>
                
                <div class="bg-blue-50 p-4 rounded border border-blue-200">
                    <label class="block text-sm font-bold text-blue-800 mb-2">Signature / Validation du Client</label>
                    <input type="text" name="signature_nom" placeholder="Taper le nom pour valider..." class="block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-2">
                    <label class="inline-flex items-center">
                        <input type="checkbox" name="accord_client" required class="rounded border-gray-300 text-blue-600 shadow-sm h-5 w-5">
                        <span class="ml-2 text-blue-800 font-medium">J'accepte et valide les informations saisies sur cette fiche.</span>
                    </label>
                </div>
            </section>

            <div class="flex justify-end gap-4 border-t-2 pt-4">
                <button type="button" onclick="exporterDonnees()" class="px-6 py-3 bg-green-600 text-white text-lg rounded hover:bg-green-700 font-bold shadow-lg w-full md:w-auto">Sauvegarder & Exporter (JSON)</button>
            </div>

        </form>
    </div>

    <script>
        // --- 1. INITIALISATION DE LA CARTE ---
        const map = L.map('map').setView([15.9963, -61.7196], 18);

        L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            attribution: '© Google',
            maxNativeZoom: 19,
            maxZoom: 24
        }).addTo(map);

        // --- 2. OUTILS DE DESSIN ET RÈGLE ---
        map.pm.setLang('fr');
        map.pm.addControls({
            position: 'topleft',
            drawMarker: false,       
            drawCircleMarker: false, 
            drawPolyline: true,      // C'EST L'OUTIL RÈGLE / LIGNE
            drawRectangle: true,     
            drawPolygon: true,       
            drawCircle: true,        
            drawText: false,         
            editMode: true,          
            dragMode: true,          
            cutPolygon: false,       
            removalMode: true        
        });

        // Activer l'affichage des distances sur les outils
        map.pm.setGlobalOptions({
            measurements: { measurement: true, displayFormat: 'metric' }
        });

        let currentDrawColor = '#22c55e';
        map.pm.setPathOptions({
            color: currentDrawColor,
            fillColor: currentDrawColor,
            fillOpacity: 0.4,
            weight: 3
        });

        function changerCouleur(couleur, btnElement) {
            currentDrawColor = couleur;
            map.pm.setPathOptions({ color: currentDrawColor, fillColor: currentDrawColor, fillOpacity: 0.4, weight: 3 });

            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('border-gray-800');
                btn.classList.add('border-transparent');
            });
            btnElement.classList.remove('border-transparent');
            btnElement.classList.add('border-gray-800');
        }

        // --- 3. FONCTION DE GÉOLOCALISATION ---
        function centrerSurMoi() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        map.flyTo([lat, lng], 21);
                    }, 
                    function(error) {
                        alert("Impossible de vous localiser. Vérifiez que le GPS est activé sur votre appareil.");
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
            }
        }

        // --- 4. BASE DE DONNÉES DES TRAVAUX ---
        const donneesTravaux = {
            'Taille': {
                titre: 'Taille',
                options: ['Architecturée', 'Douce', 'Rabattage', 'Fruitière', 'Remontée', 'Formation', 'Eclaircie'],
                unites: ['m2', 'm3', 'diamètre', 'm de haut', 'unité']
            },
            'Tonte': {
                titre: 'Tonte / Débroussaillage',
                options: ['Avec ramassage', 'Mulching', 'Prestige', 'Fauchage', 'Passage', 'Défrichage'],
                unites: ['m2', 'à raz', 'relance de pelouse']
            },
            'Nettoyage': {
                titre: 'Nettoyage',
                options: ['Eclaircie', 'Nettoiement', 'Désherbage', 'Rhyzome', 'Grimpantes'],
                unites: ['m2', 'm linéaire', 'm de haut']
            },
            'Creation': {
                titre: 'Création',
                options: ['Plantation', 'Aménagement Bois', 'Aménagement Pierre', 'Artificialisation', 'Concept', 'Conception & Réalisation', 'Réalisation', 'Engazonnement', 'Maçonnerie'],
                unites: ['m2', 'forfait', 'm linéaire']
            }
        };

        // --- 5. GESTION DYNAMIQUE DES TRAVAUX ---
        function ajouterBlocTravail() {
            const select = document.getElementById('selectCategorieTravaux');
            const categorieKey = select.value;
            const config = donneesTravaux[categorieKey];
            const conteneur = document.getElementById('conteneurTravaux');

            const divBloc = document.createElement('div');
            divBloc.className = 'bloc-travail border-l-4 border-green-500 bg-white shadow p-4 rounded relative mb-4';
            divBloc.dataset.categorie = config.titre;

            const btnSupprimer = `<button type="button" onclick="this.closest('.bloc-travail').remove()" class="absolute top-2 right-2 text-red-500 hover:text-red-700 font-bold text-sm bg-red-100 px-2 py-1 rounded">X Supprimer</button>`;

            let htmlOptions = '<div class="flex flex-wrap gap-4 mb-4 mt-2">';
            config.options.forEach(opt => {
                htmlOptions += `
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" value="${opt}" class="travail-option rounded border-gray-300 text-green-600 shadow-sm h-4 w-4">
                        <span class="ml-2 text-sm text-gray-700">${opt}</span>
                    </label>
                `;
            });
            htmlOptions += '</div>';

            let htmlQuantite = `
                <div class="flex items-center gap-3 bg-gray-50 p-2 rounded inline-flex border flex-wrap">
                    <input type="number" placeholder="Quantité (ex: 10)" class="travail-qte border p-1 rounded w-32 text-sm">
                    <select class="travail-unite border p-1 rounded text-sm bg-white">
                        <option value="">-- Unité --</option>
            `;
            config.unites.forEach(u => {
                htmlQuantite += `<option value="${u}">${u}</option>`;
            });
            htmlQuantite += `</select></div>`;

            divBloc.innerHTML = `${btnSupprimer} <h3 class="font-bold text-lg text-green-800 border-b pb-1 inline-block pr-4">${config.titre}</h3> ${htmlOptions} ${htmlQuantite}`;
            conteneur.appendChild(divBloc);
        }

        // --- 6. EXPORTATION (SAUVEGARDE) ---
        function exporterDonnees() {
            const form = document.getElementById('chantierForm');
            if(!form.reportValidity()) return; 

            const formData = new FormData(form);
            const data = { infos_generales: {}, travaux: [], plan_geographique: null };

            for (let [key, value] of formData.entries()) {
                if (data.infos_generales[key]) {
                    if (!Array.isArray(data.infos_generales[key])) data.infos_generales[key] = [data.infos_generales[key]];
                    data.infos_generales[key].push(value);
                } else {
                    data.infos_generales[key] = value;
                }
            }

            document.querySelectorAll('.bloc-travail').forEach(bloc => {
                const categorie = bloc.dataset.categorie;
                const optionsCochees = Array.from(bloc.querySelectorAll('.travail-option:checked')).map(cb => cb.value);
                const quantite = bloc.querySelector('.travail-qte').value;
                const unite = bloc.querySelector('.travail-unite').value;
                if (optionsCochees.length > 0 || quantite !== "") {
                    data.travaux.push({ categorie: categorie, options_selectionnees: optionsCochees, quantite: quantite, unite: unite });
                }
            });

            const geojsonFeatures = [];
            map.pm.getGeomanDrawLayers().forEach(layer => {
                const geojson = layer.toGeoJSON();
                geojson.properties.color = layer.options.color || '#22c55e';
                if(layer instanceof L.Circle) {
                    geojson.properties.radius = layer.getRadius();
                    geojson.properties.type = "Circle";
                }
                geojsonFeatures.push(geojson);
            });

            if (geojsonFeatures.length > 0) data.plan_geographique = { type: "FeatureCollection", features: geojsonFeatures };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            const nomFichier = data.infos_generales.client_nom ? data.infos_generales.client_nom.replace(/\s+/g, '_') : 'client_inconnu';
            const dateFichier = new Date().toISOString().split('T')[0];
            downloadAnchorNode.setAttribute("download", `Chantier_${nomFichier}_${dateFichier}.json`);
            
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();

            alert("Les données ont été exportées. Sur iPad, vous les trouverez dans l'application 'Fichiers' (Dossier Téléchargements).");
        }

        // --- 7. IMPORTATION (CHARGEMENT D'UNE FICHE EXISTANTE) ---
        function importerDonnees(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);

                    // A. Remplir les infos générales
                    for (let key in data.infos_generales) {
                        const elements = document.getElementsByName(key);
                        if (elements.length > 0) {
                            if (elements[0].type === 'checkbox' || elements[0].type === 'radio') {
                                const values = Array.isArray(data.infos_generales[key]) ? data.infos_generales[key] : [data.infos_generales[key]];
                                elements.forEach(el => el.checked = values.includes(el.value));
                            } else {
                                elements[0].value = data.infos_generales[key];
                            }
                        }
                    }

                    // B. Remplir les travaux
                    document.getElementById('conteneurTravaux').innerHTML = ''; // Nettoyer
                    if (data.travaux) {
                        data.travaux.forEach(t => {
                            let catKey = Object.keys(donneesTravaux).find(k => donneesTravaux[k].titre === t.categorie);
                            if(catKey) {
                                document.getElementById('selectCategorieTravaux').value = catKey;
                                ajouterBlocTravail();
                                const blocs = document.querySelectorAll('.bloc-travail');
                                const lastBloc = blocs[blocs.length - 1];
                                t.options_selectionnees.forEach(opt => {
                                    const cb = Array.from(lastBloc.querySelectorAll('.travail-option')).find(c => c.value === opt);
                                    if(cb) cb.checked = true;
                                });
                                lastBloc.querySelector('.travail-qte').value = t.quantite || '';
                                lastBloc.querySelector('.travail-unite').value = t.unite || '';
                            }
                        });
                    }

                    // C. Restaurer la carte
                    map.pm.getGeomanDrawLayers().forEach(layer => map.removeLayer(layer)); // Vider les anciens dessins
                    if (data.plan_geographique) {
                        L.geoJSON(data.plan_geographique, {
                            style: function(feature) {
                                return { color: feature.properties.color || '#22c55e', fillColor: feature.properties.color || '#22c55e', fillOpacity: 0.4, weight: 3 };
                            },
                            pointToLayer: function(feature, latlng) {
                                if (feature.properties.type === "Circle" && feature.properties.radius) return L.circle(latlng, {radius: feature.properties.radius});
                                return L.marker(latlng);
                            },
                            onEachFeature: function(feature, layer) {
                                layer.options.color = feature.properties.color;
                                layer.options.fillColor = feature.properties.color;
                            }
                        }).addTo(map);
                    }

                    alert("Fiche rechargée avec succès !");
                } catch (error) {
                    alert("Erreur lors de la lecture du fichier : " + error.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
