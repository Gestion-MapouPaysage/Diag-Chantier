<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de Chantier</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-green-700 border-b-2 border-green-500 pb-2 mb-6">Fiche de Chantier</h1>

        <form id="chantierForm" class="space-y-8">

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">1. Informations Client</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Nom & Prénom</label>
                        <input type="text" name="client_nom" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Téléphone</label>
                        <input type="tel" name="client_tel" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Courriel</label>
                        <input type="email" name="client_email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Date de visite</label>
                        <input type="date" name="date_visite" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Date de chantier souhaitée</label>
                        <input type="date" name="date_chantier" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Adresse postale</label>
                        <input type="text" name="client_adresse" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium">Stationnement</label>
                        <select name="stationnement" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Facile/Devant">Facile / Devant</option>
                            <option value="Difficile/rue Etroite">Difficile / Rue Étroite</option>
                            <option value="éloigné >20m">Éloigné > 20m</option>
                            <option value="Parking/Garage">Parking / Garage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Passage</label>
                        <select name="passage" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Libre">Libre</option>
                            <option value="Standard/Portail">Standard / Portail</option>
                            <option value="Etroit/Porte">Étroit / Porte</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Réseaux (Cochez si présents)</label>
                        <div class="mt-2 space-x-4">
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux" value="Câbles/Tuyauterie" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Câbles / Tuyauterie</span></label>
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux" value="Regard" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Regard / Sortie visible</span></label>
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux" value="Arrosage" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Arrosage</span></label>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">2. Doléances & Contrat</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Type de Contrat</label>
                        <select name="contrat" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Ponctuel">Ponctuel</option>
                            <option value="Quinzomadaire/Trihebdomadaire">Quinzomadaire / Trihebdomadaire</option>
                            <option value="Mensuel">Mensuel</option>
                            <option value="Bimestriel">Bimestriel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Préférence planning</label>
                        <input type="text" name="pref_planning" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Notes & Doléances</label>
                        <textarea name="notes_doleances" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"></textarea>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">3. Information Station (Terrain)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Topographie</label>
                        <select name="topographie" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Plat">Plat</option>
                            <option value="Pente douce">Pente douce</option>
                            <option value="Talus raide">Talus raide</option>
                            <option value="Diversifié">Diversifié</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Texture du sol</label>
                        <select name="texture_sol" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Argileux">Argileux</option>
                            <option value="Sableux">Sableux</option>
                            <option value="Limoneux">Limoneux</option>
                            <option value="Caillouteux">Caillouteux</option>
                            <option value="Mélangé/Importé">Mélangé / Importé</option>
                        </select>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">4. Travaux à réaliser</h2>
                
                <div class="flex flex-col md:flex-row gap-4 mb-6 bg-green-50 p-4 rounded border border-green-200">
                    <div class="flex-grow">
                        <label class="block text-sm font-bold text-green-800 mb-1">Ajouter une catégorie de travaux :</label>
                        <select id="selectCategorieTravaux" class="block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="Taille">Taille</option>
                            <option value="Tonte">Tonte / Débroussaillage</option>
                            <option value="Nettoyage">Nettoyage</option>
                            <option value="Creation">Création</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="button" onclick="ajouterBlocTravail()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 font-bold shadow transition">
                            + Ajouter ces travaux
                        </button>
                    </div>
                </div>

                <div id="conteneurTravaux" class="space-y-4">
                    </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">5. Divers & Validation</h2>
                <div class="mb-4">
                    <label class="block text-sm font-medium">Observations Diverses</label>
                    <textarea name="observations_diverses" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"></textarea>
                </div>
                
                <div class="bg-blue-50 p-4 rounded border border-blue-200">
                    <label class="block text-sm font-bold text-blue-800 mb-2">Signature / Validation du Client</label>
                    <input type="text" name="signature_nom" placeholder="Taper le nom pour valider..." class="block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-2">
                    <label class="inline-flex items-center">
                        <input type="checkbox" name="accord_client" required class="rounded border-gray-300 text-blue-600 shadow-sm h-5 w-5">
                        <span class="ml-2 text-blue-800 font-medium">J'accepte et valide les informations saisies sur cette fiche.</span>
                    </label>
                </div>
            </section>

            <div class="flex justify-end gap-4 border-t-2 pt-4">
                <button type="button" onclick="exporterDonnees()" class="px-6 py-3 bg-green-600 text-white text-lg rounded hover:bg-green-700 font-bold shadow-lg w-full md:w-auto">Sauvegarder & Exporter (JSON)</button>
            </div>

        </form>
    </div>

    <script>
        // --- 1. Base de données des options de travaux (tirée de votre tableau) ---
        const donneesTravaux = {
            'Taille': {
                titre: 'Taille',
                options: ['Architecturée', 'Douce', 'Rabattage', 'Fruitière', 'Remontée', 'Formation', 'Eclaircie'],
                unites: ['m2', 'm3', 'diamètre', 'm de haut', 'unité']
            },
            'Tonte': {
                titre: 'Tonte / Débroussaillage',
                options: ['Avec ramassage', 'Mulching', 'Prestige', 'Fauchage', 'Passage', 'Défrichage'],
                unites: ['m2', 'à raz', 'relance de pelouse']
            },
            'Nettoyage': {
                titre: 'Nettoyage',
                options: ['Eclaircie', 'Nettoiement', 'Désherbage', 'Rhyzome', 'Grimpantes'],
                unites: ['m2', 'm linéaire', 'm de haut']
            },
            'Creation': {
                titre: 'Création',
                options: ['Plantation', 'Aménagement Bois', 'Aménagement Pierre', 'Artificialisation', 'Concept', 'Conception & Réalisation', 'Réalisation', 'Engazonnement', 'Maçonnerie'],
                unites: ['m2', 'forfait', 'm linéaire']
            }
        };

        // --- 2. Fonction pour ajouter un bloc de travaux sur l'écran ---
        function ajouterBlocTravail() {
            const select = document.getElementById('selectCategorieTravaux');
            const categorieKey = select.value;
            const config = donneesTravaux[categorieKey];
            const conteneur = document.getElementById('conteneurTravaux');

            // Création de l'élément div principal
            const divBloc = document.createElement('div');
            divBloc.className = 'bloc-travail border-l-4 border-green-500 bg-white shadow p-4 rounded relative mb-4';
            divBloc.dataset.categorie = config.titre;

            // Bouton de suppression
            const btnSupprimer = `<button type="button" onclick="this.closest('.bloc-travail').remove()" class="absolute top-2 right-2 text-red-500 hover:text-red-700 font-bold text-sm bg-red-100 px-2 py-1 rounded">X Supprimer</button>`;

            // Générer les cases à cocher (options)
            let htmlOptions = '<div class="flex flex-wrap gap-4 mb-4 mt-2">';
            config.options.forEach(opt => {
                htmlOptions += `
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" value="${opt}" class="travail-option rounded border-gray-300 text-green-600 shadow-sm h-4 w-4">
                        <span class="ml-2 text-sm text-gray-700">${opt}</span>
                    </label>
                `;
            });
            htmlOptions += '</div>';

            // Générer les champs Quantité et Unité
            let htmlQuantite = `
                <div class="flex items-center gap-3 bg-gray-50 p-2 rounded inline-flex border">
                    <input type="number" placeholder="Quantité (ex: 10)" class="travail-qte border p-1 rounded w-32 text-sm">
                    <select class="travail-unite border p-1 rounded text-sm bg-white">
                        <option value="">-- Unité --</option>
            `;
            config.unites.forEach(u => {
                htmlQuantite += `<option value="${u}">${u}</option>`;
            });
            htmlQuantite += `</select></div>`;

            // Assemblage du bloc
            divBloc.innerHTML = `
                ${btnSupprimer}
                <h3 class="font-bold text-lg text-green-800 border-b pb-1 inline-block pr-4">${config.titre}</h3>
                ${htmlOptions}
                ${htmlQuantite}
            `;

            conteneur.appendChild(divBloc);
        }

        // --- 3. Fonction pour récupérer et exporter toutes les données ---
        function exporterDonnees() {
            const form = document.getElementById('chantierForm');
            if(!form.reportValidity()) return; 

            const formData = new FormData(form);
            const data = { infos_generales: {}, travaux: [] };

            // 1. Récupérer les infos classiques (Client, terrain, validation)
            for (let [key, value] of formData.entries()) {
                if (data.infos_generales[key]) {
                    if (!Array.isArray(data.infos_generales[key])) {
                        data.infos_generales[key] = [data.infos_generales[key]];
                    }
                    data.infos_generales[key].push(value);
                } else {
                    data.infos_generales[key] = value;
                }
            }

            // 2. Récupérer les blocs dynamiques de travaux
            const blocsTravaux = document.querySelectorAll('.bloc-travail');
            blocsTravaux.forEach(bloc => {
                const categorie = bloc.dataset.categorie;
                const optionsCochees = Array.from(bloc.querySelectorAll('.travail-option:checked')).map(cb => cb.value);
                const quantite = bloc.querySelector('.travail-qte').value;
                const unite = bloc.querySelector('.travail-unite').value;

                // N'ajouter que s'il y a au moins une option cochée ou une quantité saisie
                if (optionsCochees.length > 0 || quantite !== "") {
                    data.travaux.push({
                        categorie: categorie,
                        options_selectionnees: optionsCochees,
                        quantite: quantite,
                        unite: unite
                    });
                }
            });

            // 3. Création et téléchargement du fichier JSON
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            
            const nomFichier = data.infos_generales.client_nom ? data.infos_generales.client_nom.replace(/\s+/g, '_') : 'client_inconnu';
            const dateFichier = new Date().toISOString().split('T')[0];
            downloadAnchorNode.setAttribute("download", `Chantier_${nomFichier}_${dateFichier}.json`);
            
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();

            alert("Les données du chantier ont été exportées avec succès !");
        }
    </script>
</body>
</html>
