<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de Chantier</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-green-700 border-b-2 border-green-500 pb-2 mb-6">Fiche de Chantier</h1>

        <form id="chantierForm" class="space-y-8">

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">1. Informations Client</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Nom & Prénom</label>
                        <input type="text" name="client_nom" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Téléphone</label>
                        <input type="tel" name="client_tel" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Courriel</label>
                        <input type="email" name="client_email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Date de visite</label>
                        <input type="date" name="date_visite" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Date de chantier souhaitée</label>
                        <input type="date" name="date_chantier" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Adresse postale</label>
                        <input type="text" name="client_adresse" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium">Stationnement</label>
                        <select name="stationnement" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Facile/Devant">Facile / Devant</option>
                            <option value="Difficile/rue Etroite">Difficile / Rue Étroite</option>
                            <option value="éloigné >20m">Éloigné > 20m</option>
                            <option value="Parking/Garage">Parking / Garage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Passage</label>
                        <select name="passage" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Libre">Libre</option>
                            <option value="Standard/Portail">Standard / Portail</option>
                            <option value="Etroit/Porte">Étroit / Porte</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Réseaux (Cochez si présents)</label>
                        <div class="mt-2 space-x-4">
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux_cables" value="Oui" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Câbles / Tuyauterie</span></label>
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux_regard" value="Oui" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Regard / Sortie visible</span></label>
                            <label class="inline-flex items-center"><input type="checkbox" name="reseaux_arrosage" value="Oui" class="rounded border-gray-300 text-green-600 shadow-sm"> <span class="ml-2">Arrosage</span></label>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">2. Doléances & Contrat</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Type de Contrat</label>
                        <select name="contrat" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Ponctuel">Ponctuel</option>
                            <option value="Quinzomadaire/Trihebdomadaire">Quinzomadaire / Trihebdomadaire</option>
                            <option value="Mensuel">Mensuel</option>
                            <option value="Bimestriel">Bimestriel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Préférence planning</label>
                        <input type="text" name="pref_planning" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium">Notes & Doléances</label>
                        <textarea name="notes_doleances" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"></textarea>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">3. Information Station (Terrain)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Topographie</label>
                        <select name="topographie" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Plat">Plat</option>
                            <option value="Pente douce">Pente douce</option>
                            <option value="Talus raide">Talus raide</option>
                            <option value="Diversifié">Diversifié</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Texture du sol</label>
                        <select name="texture_sol" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="">Sélectionner...</option>
                            <option value="Argileux">Argileux</option>
                            <option value="Sableux">Sableux</option>
                            <option value="Limoneux">Limoneux</option>
                            <option value="Caillouteux">Caillouteux</option>
                            <option value="Mélangé/Importé">Mélangé / Importé</option>
                        </select>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">4. Travaux à réaliser</h2>
                
                <div class="mb-4 border border-gray-200 p-4 rounded">
                    <h3 class="font-medium text-lg mb-2 text-green-700">Taille</h3>
                    <div class="flex flex-wrap gap-4 mb-2">
                        <label><input type="checkbox" name="taille_type" value="Architecturée"> Architecturée</label>
                        <label><input type="checkbox" name="taille_type" value="Douce"> Douce</label>
                        <label><input type="checkbox" name="taille_type" value="Rabattage"> Rabattage</label>
                        <label><input type="checkbox" name="taille_type" value="Fruitière"> Fruitière</label>
                        <label><input type="checkbox" name="taille_type" value="Remontée"> Remontée</label>
                        <label><input type="checkbox" name="taille_type" value="Formation"> Formation</label>
                        <label><input type="checkbox" name="taille_type" value="Eclaircie"> Éclaircie</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" name="taille_qte" placeholder="Quantité" class="border p-1 rounded w-24">
                        <select name="taille_unite" class="border p-1 rounded">
                            <option value="m2">m²</option>
                            <option value="m3">m³</option>
                            <option value="diam">Diamètre</option>
                            <option value="m_haut">m de haut</option>
                            <option value="unite">Unité</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 border border-gray-200 p-4 rounded">
                    <h3 class="font-medium text-lg mb-2 text-green-700">Tonte / Débroussaillage</h3>
                    <div class="flex flex-wrap gap-4 mb-2">
                        <label><input type="checkbox" name="tonte_type" value="Ramassage"> Avec ramassage</label>
                        <label><input type="checkbox" name="tonte_type" value="Mulching"> Mulching</label>
                        <label><input type="checkbox" name="tonte_type" value="Prestige"> Prestige</label>
                        <label><input type="checkbox" name="tonte_type" value="Fauchage"> Fauchage</label>
                        <label><input type="checkbox" name="tonte_type" value="Passage"> Passage</label>
                        <label><input type="checkbox" name="tonte_type" value="Défrichage"> Défrichage</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" name="tonte_qte" placeholder="Quantité" class="border p-1 rounded w-24">
                        <select name="tonte_unite" class="border p-1 rounded">
                            <option value="m2">m²</option>
                            <option value="a_raz">À ras</option>
                            <option value="relance">Relance de pelouse</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 border border-gray-200 p-4 rounded">
                    <h3 class="font-medium text-lg mb-2 text-green-700">Nettoyage</h3>
                    <div class="flex flex-wrap gap-4 mb-2">
                        <label><input type="checkbox" name="nettoyage_type" value="Eclaircie"> Éclaircie</label>
                        <label><input type="checkbox" name="nettoyage_type" value="Nettoiement"> Nettoiement</label>
                        <label><input type="checkbox" name="nettoyage_type" value="Désherbage"> Désherbage</label>
                        <label><input type="checkbox" name="nettoyage_type" value="Rhyzome"> Rhizome</label>
                        <label><input type="checkbox" name="nettoyage_type" value="Grimpantes"> Grimpantes</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" name="nettoyage_qte" placeholder="Quantité" class="border p-1 rounded w-24">
                        <select name="nettoyage_unite" class="border p-1 rounded">
                            <option value="m2">m²</option>
                            <option value="m_lineaire">m linéaire</option>
                            <option value="m_haut">m de haut</option>
                        </select>
                    </div>
                </div>

                <div class="border border-gray-200 p-4 rounded">
                    <h3 class="font-medium text-lg mb-2 text-green-700">Création</h3>
                    <div class="flex flex-wrap gap-4">
                        <label><input type="checkbox" name="creation_type" value="Plantation"> Plantation</label>
                        <label><input type="checkbox" name="creation_type" value="Aménagement Bois"> Aménagement bois</label>
                        <label><input type="checkbox" name="creation_type" value="Aménagement Pierre"> Aménagement pierre</label>
                        <label><input type="checkbox" name="creation_type" value="Artificialisation"> Artificialisation</label>
                        <label><input type="checkbox" name="creation_type" value="Concept"> Concept</label>
                        <label><input type="checkbox" name="creation_type" value="Conception_Realisation"> Conception & Réalisation</label>
                        <label><input type="checkbox" name="creation_type" value="Realisation"> Réalisation</label>
                        <label><input type="checkbox" name="creation_type" value="Engazonnement"> Engazonnement</label>
                        <label><input type="checkbox" name="creation_type" value="Maconnerie"> Maçonnerie</label>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-gray-700 mb-4 bg-gray-100 p-2 rounded">5. Divers & Validation</h2>
                <div class="mb-4">
                    <label class="block text-sm font-medium">Observations Diverses</label>
                    <textarea name="observations_diverses" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2"></textarea>
                </div>
                
                <div class="bg-blue-50 p-4 rounded border border-blue-200">
                    <label class="block text-sm font-bold text-blue-800 mb-2">Signature / Validation du Client</label>
                    <input type="text" name="signature_nom" placeholder="Taper le nom pour valider..." class="block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-2">
                    <label class="inline-flex items-center">
                        <input type="checkbox" name="accord_client" required class="rounded border-gray-300 text-blue-600 shadow-sm h-5 w-5">
                        <span class="ml-2 text-blue-800 font-medium">J'accepte et valide les informations saisies sur cette fiche.</span>
                    </label>
                </div>
            </section>

            <div class="flex justify-end gap-4 border-t-2 pt-4">
                <button type="reset" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 font-medium">Réinitialiser</button>
                <button type="button" onclick="exporterDonnees()" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 font-bold shadow-lg">Sauvegarder & Exporter (JSON)</button>
            </div>

        </form>
    </div>

    <script>
        function exporterDonnees() {
            const form = document.getElementById('chantierForm');
            
            // Vérification de la validation requise
            if(!form.reportValidity()) return; 

            const formData = new FormData(form);
            const data = {};

            // Convertir FormData en objet JSON (gère les checkboxes multiples)
            for (let [key, value] of formData.entries()) {
                if (data[key]) {
                    if (!Array.isArray(data[key])) {
                        data[key] = [data[key]];
                    }
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            }

            // Création du fichier JSON
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            
            // Nom du fichier avec le nom du client et la date
            const nomFichier = data.client_nom ? data.client_nom.replace(/\s+/g, '_') : 'client_inconnu';
            const dateFichier = new Date().toISOString().split('T')[0];
            downloadAnchorNode.setAttribute("download", `Fiche_Chantier_${nomFichier}_${dateFichier}.json`);
            
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();

            alert("Les données du chantier ont été exportées avec succès !");
        }
    </script>
</body>
</html>
